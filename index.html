    <script>

        document.querySelectorAll('.media-image').forEach(mediaContainer => {

            mediaContainer.addEventListener('click', function (event) {
                // Evitar que otros botones dentro de la card
                // provoquen comportamientos inesperados
                if (event.target.closest('.share-button')) {
                    return;
                }
                // Obtener la card
                const card = this.closest('.media-card');
                if (!card) {
                    return;
                }

                // ==========================================
                // OBTENER TÍTULO
                // ==========================================
                const titleElement = card.querySelector('.card-title');
                const title = titleElement
                    ? titleElement.textContent.trim()
                    : '';
                // ==========================================
                // OBTENER CODIGOS
                // ==========================================
                const codeElement = card.querySelector('.card-codes');
               const codes = codeElement
                    ? codeElement.textContent.trim()
                    : ''; 
                // ==========================================
                // CONTENEDOR DEL MODAL
                // ==========================================
                const modalContainer = document.getElementById('modalMediaContainer');

                const modalTitle = document.getElementById('modalMediaTitle');

                const modalCodes = document.getElementById('modalMediaCodes');
                // Limpiar contenido anterior
                modalContainer.innerHTML = '';

                modalTitle.textContent = title;
                modalCodes.textContent = codes;

                // ==========================================
                // ¿ES VIDEO?
                // ==========================================

                const video = card.querySelector('video');

                if (video) {

                    const source = video.querySelector('source');

                    if (!source) {
                        return;
                    }

                    const modalVideo =
                        document.createElement('video');

                    modalVideo.controls = true;
                    modalVideo.autoplay = true;
                    modalVideo.playsInline = true;

                    modalVideo.src = source.src;

                    modalContainer.appendChild(modalVideo);

                }


                // ==========================================
                // ¿ES IMAGEN?
                // ==========================================

                else {

                    const image =
                        card.querySelector('.media-image > img');

                    if (!image) {
                        return;
                    }

                    const modalImage =
                        document.createElement('img');

                    modalImage.src = image.src;

                    modalImage.alt = title;

                    modalContainer.appendChild(modalImage);

                }


                // ==========================================
                // ABRIR MODAL
                // ==========================================

                const modalElement =
                    document.getElementById('mediaModal');

                const modal =
                    bootstrap.Modal.getOrCreateInstance(
                        modalElement
                    );

                modal.show();

            });

        });


        // ==========================================
        // AL CERRAR MODAL
        // PAUSAR Y LIMPIAR VIDEO
        // ==========================================

        document
            .getElementById('mediaModal')
            .addEventListener('hidden.bs.modal', function () {

                const container =
                    document.getElementById('modalMediaContainer');

                const video =
                    container.querySelector('video');

                if (video) {

                    video.pause();

                    video.currentTime = 0;

                }

                container.innerHTML = '';

            });

        // ==========================================
        // Boton copiar
        // ==========================================

        document.getElementById("BotonCopiar").addEventListener("click", () => {
            const texto = document.getElementById("modalMediaCodes").textContent;
            const boton = document.getElementById("BotonCopiar");

            navigator.clipboard.writeText(texto)
                .then(() => {
                    boton.textContent = "Copiado";

                    setTimeout(() => {
                        boton.textContent = "Copiar";
                    }, 2000);
                })
                .catch(err => {
                    console.error("Error al copiar:", err);
                });
        });

    </script>
